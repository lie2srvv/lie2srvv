<svg xmlns="http://www.w3.org/2000/svg" width="300" height="165" viewBox="0 0 300 165" fill="none">
  <style>
    .header { font: 600 17px ui-monospace, 'Segoe UI', Ubuntu, Sans-Serif; fill: #ffffff; }
    .lang-name { font: 400 11px ui-monospace, 'Segoe UI', Ubuntu, Sans-Serif; fill: #c9d1d9; }
    .lang-pct { font: 600 11px ui-monospace, 'Segoe UI', Ubuntu, Sans-Serif; fill: #f0f6fc; }
  </style>

  <!-- Solid background matching GitHub Dark #0d1117 -->
  <rect width="300" height="165" fill="#0d1117" rx="6"/>

  <!-- Title -->
  <text x="25" y="32" class="header">Most Used Languages <tspan fill="#ff7597">♡</tspan></text>

  <!-- Progress Bar (Total width: 250px, rx=4) -->
  <g transform="translate(25, 48)">
    <mask id="barMask">
      <rect width="250" height="8" rx="4" fill="#ffffff"/>
    </mask>
    <g mask="url(#barMask)">
      <!-- Kotlin 77.24% = 193.1px -->
      <rect x="0" y="0" width="193.1" height="8" fill="#ff7597"/>
      <!-- Dart 14.53% = 36.3px -->
      <rect x="193.1" y="0" width="36.3" height="8" fill="#c084fc"/>
      <!-- TypeScript 6.13% = 15.3px -->
      <rect x="229.4" y="0" width="15.3" height="8" fill="#79c0ff"/>
      <!-- Python 0.86% = 2.2px -->
      <rect x="244.7" y="0" width="2.2" height="8" fill="#fbcfe8"/>
      <!-- Rust 0.63% = 1.6px -->
      <rect x="246.9" y="0" width="1.6" height="8" fill="#ffb3c6"/>
      <!-- Go 0.61% = 1.5px -->
      <rect x="248.5" y="0" width="1.5" height="8" fill="#a7f3d0"/>
    </g>
  </g>

  <!-- Left Column -->
  <g transform="translate(25, 78)">
    <!-- Kotlin -->
    <g transform="translate(0, 0)">
      <circle cx="5" cy="5" r="4.5" fill="#ff7597"/>
      <text x="16" y="8" class="lang-name">Kotlin <tspan class="lang-pct">77.24%</tspan></text>
    </g>

    <!-- Dart -->
    <g transform="translate(0, 24)">
      <circle cx="5" cy="5" r="4.5" fill="#c084fc"/>
      <text x="16" y="8" class="lang-name">Dart <tspan class="lang-pct">14.53%</tspan></text>
    </g>

    <!-- TypeScript -->
    <g transform="translate(0, 48)">
      <circle cx="5" cy="5" r="4.5" fill="#79c0ff"/>
      <text x="16" y="8" class="lang-name">TypeScript <tspan class="lang-pct">6.13%</tspan></text>
    </g>
  </g>

  <!-- Right Column -->
  <g transform="translate(160, 78)">
    <!-- Python -->
    <g transform="translate(0, 0)">
      <circle cx="5" cy="5" r="4.5" fill="#fbcfe8"/>
      <text x="16" y="8" class="lang-name">Python <tspan class="lang-pct">0.86%</tspan></text>
    </g>

    <!-- Rust -->
    <g transform="translate(0, 24)">
      <circle cx="5" cy="5" r="4.5" fill="#ffb3c6"/>
      <text x="16" y="8" class="lang-name">Rust <tspan class="lang-pct">0.63%</tspan></text>
    </g>

    <!-- Go -->
    <g transform="translate(0, 48)">
      <circle cx="5" cy="5" r="4.5" fill="#a7f3d0"/>
      <text x="16" y="8" class="lang-name">Go <tspan class="lang-pct">0.61%</tspan></text>
    </g>
  </g>
</svg>
