<svg xmlns="http://www.w3.org/2000/svg" width="290" height="245" viewBox="0 0 290 245" fill="none">
  <defs>
    <!-- Dark glassmorphic background matching GitHub dark theme -->
    <linearGradient id="bg_vpn" x1="0" y1="0" x2="290" y2="245" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#121720"/>
      <stop offset="100%" stop-color="#0a0d13"/>
    </linearGradient>

    <!-- Subtle corner glow -->
    <radialGradient id="glow_vpn" cx="0" cy="0" r="140" gradientUnits="userSpaceOnUse" gradientTransform="translate(240, 30) scale(130)">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Glowing Icon Box Background -->
    <linearGradient id="icon_bg_vpn" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.06"/>
    </linearGradient>

    <filter id="shadow_vpn" x="-20" y="-20" width="84" height="84" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Card Base -->
  <rect x="1" y="1" width="288" height="243" rx="16" fill="url(#bg_vpn)"/>
  <rect x="1" y="1" width="288" height="243" rx="16" fill="url(#glow_vpn)"/>
  <rect x="1" y="1" width="288" height="243" rx="16" stroke="#252d3a" stroke-width="1.2"/>

  <!-- Icon Box -->
  <g transform="translate(22, 22)">
    <rect width="44" height="44" rx="12" fill="url(#icon_bg_vpn)" stroke="#38bdf8" stroke-opacity="0.38" stroke-width="1.2" filter="url(#shadow_vpn)"/>
    <path d="M22 13L13 17V23C13 28.5 16.8 33.7 22 35C27.2 33.7 31 28.5 31 23V17L22 13Z" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M22 13V35C27.2 33.7 31 28.5 31 23V17L22 13Z" fill="#38bdf8" fill-opacity="0.4"/>
  </g>

  <!-- Title & Arrow -->
  <g transform="translate(22, 94)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#ffffff" letter-spacing="-0.3">LieVPN</text>
    
    <!-- External link arrow -->
    <g transform="translate(242, -14)">
      <circle cx="2" cy="2" r="11" fill="#1b222d" stroke="#303b4b" stroke-width="1"/>
      <path d="M-1 -1H5M5 -1V5M5 -1L-2 6" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Description -->
  <text x="22" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" line-height="1.5">
    <tspan x="22" dy="0">Cross-platform VPN client powered by</tspan><tspan x="22" dy="20">Clash.Meta core &amp; custom routing.</tspan><tspan x="22" dy="20">Granular rules with modern UI.</tspan>
  </text>

  <!-- Tags / Stack -->
  <g transform="translate(0, 202)">
    
    <rect x="22" y="0" width="76.5" height="22" rx="6" fill="rgba(56,189,248,0.12)" stroke="rgba(56,189,248,0.3)" stroke-width="1"/>
    <circle cx="30" cy="11" r="2.5" fill="#38bdf8"/>
    <text x="38" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">Flutter</text>
        
    <rect x="104.5" y="0" width="54.0" height="22" rx="6" fill="rgba(96,165,250,0.12)" stroke="rgba(96,165,250,0.3)" stroke-width="1"/>
    <circle cx="112.5" cy="11" r="2.5" fill="#60a5fa"/>
    <text x="120.5" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#60a5fa">Dart</text>
        
    <rect x="164.5" y="0" width="39.0" height="22" rx="6" fill="rgba(0,173,216,0.12)" stroke="rgba(0,173,216,0.3)" stroke-width="1"/>
    <circle cx="172.5" cy="11" r="2.5" fill="#00add8"/>
    <text x="180.5" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#00add8">Go</text>
        
    <rect x="209.5" y="0" width="54.0" height="22" rx="6" fill="rgba(249,115,22,0.12)" stroke="rgba(249,115,22,0.3)" stroke-width="1"/>
    <circle cx="217.5" cy="11" r="2.5" fill="#f97316"/>
    <text x="225.5" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#f97316">Rust</text>
        
  </g>
</svg>