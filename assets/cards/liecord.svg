<svg xmlns="http://www.w3.org/2000/svg" width="290" height="245" viewBox="0 0 290 245" fill="none">
  <defs>
    <!-- Dark glassmorphic background matching GitHub dark theme -->
    <linearGradient id="bg_cord" x1="0" y1="0" x2="290" y2="245" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#121720"/>
      <stop offset="100%" stop-color="#0a0d13"/>
    </linearGradient>

    <!-- Subtle corner glow -->
    <radialGradient id="glow_cord" cx="0" cy="0" r="140" gradientUnits="userSpaceOnUse" gradientTransform="translate(240, 30) scale(130)">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <!-- Glowing Icon Box Background -->
    <linearGradient id="icon_bg_cord" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.06"/>
    </linearGradient>

    <filter id="shadow_cord" x="-20" y="-20" width="84" height="84" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#a855f7" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Card Base -->
  <rect x="1" y="1" width="288" height="243" rx="16" fill="url(#bg_cord)"/>
  <rect x="1" y="1" width="288" height="243" rx="16" fill="url(#glow_cord)"/>
  <rect x="1" y="1" width="288" height="243" rx="16" stroke="#252d3a" stroke-width="1.2"/>

  <!-- Icon Box -->
  <g transform="translate(22, 22)">
    <rect width="44" height="44" rx="12" fill="url(#icon_bg_cord)" stroke="#a855f7" stroke-opacity="0.38" stroke-width="1.2" filter="url(#shadow_cord)"/>
    <path d="M14 26V16C14 14.3 15.3 13 17 13H27C28.7 13 30 14.3 30 16V24C30 25.7 28.7 27 27 27H17L14 30V26Z" fill="none" stroke="#a855f7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="19" cy="20" r="1.5" fill="#a855f7"/>
<circle cx="24" cy="20" r="1.5" fill="#a855f7"/>
  </g>

  <!-- Title & Arrow -->
  <g transform="translate(22, 94)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#ffffff" letter-spacing="-0.3">LieCord</text>
    
    <!-- External link arrow -->
    <g transform="translate(242, -14)">
      <circle cx="2" cy="2" r="11" fill="#1b222d" stroke="#303b4b" stroke-width="1"/>
      <path d="M-1 -1H5M5 -1V5M5 -1L-2 6" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Description -->
  <text x="22" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" line-height="1.5">
    <tspan x="22" dy="0">Lightweight custom Discord client</tspan><tspan x="22" dy="20">built for ultra-low RAM footprint,</tspan><tspan x="22" dy="20">theming and maximum performance.</tspan>
  </text>

  <!-- Tags / Stack -->
  <g transform="translate(0, 202)">
    
    <rect x="22" y="0" width="69.0" height="22" rx="6" fill="rgba(192,132,252,0.12)" stroke="rgba(192,132,252,0.3)" stroke-width="1"/>
    <circle cx="30" cy="11" r="2.5" fill="#c084fc"/>
    <text x="38" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#c084fc">Kotlin</text>
        
    <rect x="97.0" y="0" width="99.0" height="22" rx="6" fill="rgba(56,189,248,0.12)" stroke="rgba(56,189,248,0.3)" stroke-width="1"/>
    <circle cx="105.0" cy="11" r="2.5" fill="#38bdf8"/>
    <text x="113.0" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">TypeScript</text>
        
    <rect x="202.0" y="0" width="84.0" height="22" rx="6" fill="rgba(45,212,191,0.12)" stroke="rgba(45,212,191,0.3)" stroke-width="1"/>
    <circle cx="210.0" cy="11" r="2.5" fill="#2dd4bf"/>
    <text x="218.0" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#2dd4bf">Electron</text>
        
  </g>
</svg>