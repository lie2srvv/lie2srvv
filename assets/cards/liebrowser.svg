<svg xmlns="http://www.w3.org/2000/svg" width="290" height="245" viewBox="0 0 290 245" fill="none">
  <defs>
    <!-- Dark glassmorphic background matching GitHub dark theme -->
    <linearGradient id="bg_browser" x1="0" y1="0" x2="290" y2="245" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#121720"/>
      <stop offset="100%" stop-color="#0a0d13"/>
    </linearGradient>

    <!-- Subtle corner glow -->
    <radialGradient id="glow_browser" cx="0" cy="0" r="140" gradientUnits="userSpaceOnUse" gradientTransform="translate(240, 30) scale(130)">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#f43f5e" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>

    <!-- Glowing Icon Box Background -->
    <linearGradient id="icon_bg_browser" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.06"/>
    </linearGradient>

    <filter id="shadow_browser" x="-20" y="-20" width="84" height="84" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#f43f5e" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Card Base -->
  <rect x="1" y="1" width="288" height="243" rx="16" fill="url(#bg_browser)"/>
  <rect x="1" y="1" width="288" height="243" rx="16" fill="url(#glow_browser)"/>
  <rect x="1" y="1" width="288" height="243" rx="16" stroke="#252d3a" stroke-width="1.2"/>

  <!-- Icon Box -->
  <g transform="translate(22, 22)">
    <rect width="44" height="44" rx="12" fill="url(#icon_bg_browser)" stroke="#f43f5e" stroke-opacity="0.38" stroke-width="1.2" filter="url(#shadow_browser)"/>
    <circle cx="22" cy="22" r="12" fill="none" stroke="#f43f5e" stroke-width="2.2"/>
<polygon points="26,18 24,24 18,26 20,20" fill="#f43f5e"/>
<circle cx="22" cy="22" r="1.5" fill="#ffffff"/>
  </g>

  <!-- Title & Arrow -->
  <g transform="translate(22, 94)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#ffffff" letter-spacing="-0.3">LieBrowser</text>
    
    <!-- External link arrow -->
    <g transform="translate(242, -14)">
      <circle cx="2" cy="2" r="11" fill="#1b222d" stroke="#303b4b" stroke-width="1"/>
      <path d="M-1 -1H5M5 -1V5M5 -1L-2 6" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Description -->
  <text x="22" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" line-height="1.5">
    <tspan x="22" dy="0">Privacy-focused Android browser fork</tspan><tspan x="22" dy="20">of Firefox with GeckoView engine.</tspan><tspan x="22" dy="20">Hardened security &amp; LieWeb search.</tspan>
  </text>

  <!-- Tags / Stack -->
  <g transform="translate(0, 202)">
    
    <rect x="22" y="0" width="69.0" height="22" rx="6" fill="rgba(192,132,252,0.12)" stroke="rgba(192,132,252,0.3)" stroke-width="1"/>
    <circle cx="30" cy="11" r="2.5" fill="#c084fc"/>
    <text x="38" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#c084fc">Kotlin</text>
        
    <rect x="97.0" y="0" width="91.5" height="22" rx="6" fill="rgba(251,146,60,0.12)" stroke="rgba(251,146,60,0.3)" stroke-width="1"/>
    <circle cx="105.0" cy="11" r="2.5" fill="#fb923c"/>
    <text x="113.0" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#fb923c">GeckoView</text>
        
    <rect x="194.5" y="0" width="76.5" height="22" rx="6" fill="rgba(74,222,128,0.12)" stroke="rgba(74,222,128,0.3)" stroke-width="1"/>
    <circle cx="202.5" cy="11" r="2.5" fill="#4ade80"/>
    <text x="210.5" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#4ade80">Android</text>
        
  </g>
</svg>