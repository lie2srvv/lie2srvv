<svg xmlns="http://www.w3.org/2000/svg" width="290" height="245" viewBox="0 0 290 245" fill="none">
  <defs>
    <!-- M3 Surface Container Gradient -->
    <linearGradient id="m3_bg_browser" x1="0" y1="0" x2="290" y2="245" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#221517"/>
      <stop offset="100%" stop-color="#130b0d"/>
    </linearGradient>

    <!-- M3 Ambient Dynamic Tint Glow -->
    <radialGradient id="m3_glow_browser" cx="0" cy="0" r="140" gradientUnits="userSpaceOnUse" gradientTransform="translate(240, 30) scale(130)">
      <stop offset="0%" stop-color="#ff8b94" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#ff8b94" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ff8b94" stop-opacity="0"/>
    </radialGradient>

    <!-- Icon Squircle Clip -->
    <clipPath id="icon_clip_browser">
      <rect width="48" height="48" rx="14" />
    </clipPath>

    <!-- Elevation 1 Shadow -->
    <filter id="m3_shadow_browser" x="-10" y="-10" width="310" height="265" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- M3 Card Base (Rounded-24px standard M3 card) -->
  <g filter="url(#m3_shadow_browser)">
    <rect x="1" y="1" width="288" height="243" rx="22" fill="url(#m3_bg_browser)"/>
    <rect x="1" y="1" width="288" height="243" rx="22" fill="url(#m3_glow_browser)"/>
    <rect x="1" y="1" width="288" height="243" rx="22" stroke="rgba(255, 139, 148, 0.22)" stroke-width="1.2"/>
  </g>

  <!-- Top: Real App Icon + Open In New Icon -->
  <g transform="translate(22, 22)">
    <!-- Icon Container / Background -->
    <rect width="48" height="48" rx="14" fill="rgba(255, 139, 148, 0.12)" stroke="rgba(255, 139, 148, 0.28)" stroke-width="1"/>
    
    <!-- Real App Icon -->
    <g clip-path="url(#icon_clip_browser)">
      <image href="data:image/png;base64," x="0" y="0" width="48" height="48" preserveAspectRatio="xMidYMid slice"/>
    </g>

    <!-- M3 Floating Action / Open Badge -->
    <g transform="translate(222, 4)">
      <rect width="24" height="24" rx="12" fill="rgba(255, 139, 148, 0.14)" stroke="rgba(255, 139, 148, 0.25)" stroke-width="1"/>
      <path d="M7 7H15M15 7V15M15 7L9 13" stroke="#ff8b94" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Title (Headline Small) -->
  <g transform="translate(22, 94)">
    <text x="0" y="0" font-family="'Google Sans', Roboto, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#ffebee" letter-spacing="-0.2">LieBrowser</text>
  </g>

  <!-- Description (Body Medium) -->
  <text x="22" y="123" font-family="'Google Sans Text', Roboto, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#cec2c3" line-height="1.5">
    <tspan x="22" dy="0">Privacy-focused Android browser fork</tspan><tspan x="22" dy="20">of Firefox with GeckoView engine.</tspan><tspan x="22" dy="20">Hardened security &amp; LieWeb search.</tspan>
  </text>

  <!-- M3 Assist Chips (Tech Stack) -->
  <g transform="translate(0, 201)">
    
    <rect x="22" y="0" width="65.2" height="24" rx="8" fill="rgba(255, 139, 148, 0.08)" stroke="rgba(255, 139, 148, 0.22)" stroke-width="1"/>
    <text x="54.6" y="16" text-anchor="middle" font-family="'Google Sans', Roboto, -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#ffb4ba">Kotlin</text>
        
    <rect x="95.2" y="0" width="86.8" height="24" rx="8" fill="rgba(255, 139, 148, 0.08)" stroke="rgba(255, 139, 148, 0.22)" stroke-width="1"/>
    <text x="138.6" y="16" text-anchor="middle" font-family="'Google Sans', Roboto, -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#ffb4ba">GeckoView</text>
        
    <rect x="190.0" y="0" width="72.4" height="24" rx="8" fill="rgba(255, 139, 148, 0.08)" stroke="rgba(255, 139, 148, 0.22)" stroke-width="1"/>
    <text x="226.2" y="16" text-anchor="middle" font-family="'Google Sans', Roboto, -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#ffb4ba">Android</text>
        
  </g>
</svg>